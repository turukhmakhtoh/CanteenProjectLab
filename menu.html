<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Menu Management</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Canteen Admin</h2>
  <ul>
    <li onclick="location.href='admin.html'">Dashboard</li>
    <li onclick="location.href='admin.html'">Orders</li>
    <li class="active">Menu</li>
    <li onclick="location.href='create-user.html'">Users</li>
    <li onclick="location.href='../login.html'">Logout</li>
  </ul>
</div>

<!-- Main -->
<div class="main">
  <h1>Menu Management</h1>

  <!-- ADD MENU ITEM -->
  <div class="card form-card">
    <h3>Add Menu Item</h3>

    <label>Item Name</label>
    <input type="text" id="itemName" placeholder="Eg: Masala Dosa" />

    <label>Price (₹)</label>
    <input type="number" id="itemPrice" placeholder="Eg: 50" />

    <button onclick="addItem()">Add Item</button>
  </div>

  <!-- MENU TABLE -->
  <h2>Menu Items</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Item</th>
        <th>Price (₹)</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="menuTable"></tbody>
  </table>
</div>

<script src="menu.js"></script>
</body>
</html>
